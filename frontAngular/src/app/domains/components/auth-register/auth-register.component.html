<form [formGroup]="registerForm" (ngSubmit)="onRegister()">
  <!-- Nombre de usuario -->
  <div>
    <label for="userName">Nombre de Usuario:</label>
    <input
      id="userName"
      type="text"
      formControlName="userName"
      placeholder="Ingrese su nombre de usuario"
    />
    <div *ngIf="registerForm.get('userName')?.invalid && registerForm.get('userName')?.touched">
      <small *ngIf="registerForm.get('userName')?.errors?.['required']">
        El nombre de usuario es obligatorio.
      </small>
      <small *ngIf="registerForm.get('userName')?.errors?.['minlength']">
        Debe tener al menos 3 caracteres.
      </small>
    </div>
  </div>

  <!-- Contraseña -->
  <div>
    <label for="password">Contraseña:</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      placeholder="Ingrese su contraseña"
    />
    <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
      <small *ngIf="registerForm.get('password')?.errors?.['required']">
        La contraseña es obligatoria.
      </small>
      <small *ngIf="registerForm.get('password')?.errors?.['pattern']">
        Debe incluir al menos 1 mayúscula, 1 minúscula y 1 número, con un mínimo de 6 caracteres.
      </small>
    </div>
  </div>

  <!-- Confirmar Contraseña -->
  <div>
    <label for="confirmPassword">Confirmar Contraseña:</label>
    <input
      id="confirmPassword"
      type="password"
      formControlName="confirmPassword"
      placeholder="Confirme su contraseña"
    />
    <div *ngIf="registerForm.hasError('notMatch') && registerForm.get('confirmPassword')?.touched">
      <small>Las contraseñas no coinciden.</small>
    </div>
  </div>

  <!-- Términos y condiciones -->
  <div>
    <input type="checkbox" id="terms" formControlName="terms" />
    <label for="terms">Acepto los términos y condiciones</label>
    <div *ngIf="registerForm.get('terms')?.invalid && registerForm.get('terms')?.touched">
      <small>Debes aceptar los términos y condiciones.</small>
    </div>
  </div>

  <!-- Botón de registro -->
  <button type="submit" [disabled]="isLoading || registerForm.invalid">
    {{ isLoading ? 'Registrando...' : 'Registrarse' }}
  </button>
</form>
